name: inception

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
      - wp_user_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network

  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network

  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception_network
    depends_on:
      - mariadb

  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: always
    expose:
      - "6379"
    networks:
      - inception_network
  
  static_site:
    build:
      context: requirements/bonus/static_site
      dockerfile: Dockerfile
    container_name: static_site
    restart: always
    ports:
      - "8081:8081"
    networks:
      - inception_network

  ftp:
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: always
    ports:
      - "21:21"
      - "20:20"
      - "40000-40005:40000-40005"
    environment:
      - FTP_USER=${WP_USER}
      - DOMAIN_NAME=${DOMAIN_NAME}
    secrets:
      - wp_user_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  inception_network:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/pgougne/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/pgougne/data/wordpress
