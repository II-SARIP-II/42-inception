pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40005
pasv_address=127.0.0.1
pasv_addr_resolve=YES

seccomp_sandbox=NO
listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
pam_service_name=vsftpd

local_root=/var/www/html
chroot_local_user=YES
allow_writeable_chroot=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
port_enable=YES
connect_from_port_20=YES
ftp_data_port=20

userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
